<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="title desc">
<title id="title">Mandarin Path learning mascot</title><desc id="desc">An original cute red panda character with a jade scarf, holding a little Chinese character flashcard.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbd83"/><stop offset="1" stop-color="#ef885d"/></linearGradient>
 <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6dbf9d"/><stop offset="1" stop-color="#287a62"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#6a5743" flood-opacity=".16"/></filter>
</defs>
<ellipse cx="216" cy="323" rx="116" ry="19" fill="#4d8872" opacity=".14"/>
